<!DOCTYPE html>
<!-- 文字在 options.js 里按浏览器语言填充（data-i18n* 属性），下面的英文只是兜底。 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YouBoard Clipboard Companion · Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1 data-i18n="optTitle">YouBoard Clipboard Companion · Settings</h1>

  <section>
    <h2 data-i18n="optConnHeading">Connect to YouBoard on this machine</h2>
    <p class="note" data-i18n="optConnNote">
      Open the YouBoard desktop app → Settings → Browser extension → "Copy connection info".
    </p>
    <label for="conn" data-i18n="optConnLabel">Connection info (paste one line)</label>
    <input id="conn" type="text" data-i18n-placeholder="optConnPlaceholder"
           placeholder="127.0.0.1:8765|token">
    <div class="row">
      <button id="btn-apply" class="primary" data-i18n="optApply">Parse &amp; save</button>
      <button id="btn-test" data-i18n="optTest">Test connection</button>
      <span id="test-result" class="result"></span>
    </div>
    <details>
      <summary data-i18n="optManual">Fill in manually</summary>
      <label for="url" data-i18n="optUrlLabel">Local address</label>
      <input id="url" type="text" placeholder="http://127.0.0.1:8765">
      <label for="token" data-i18n="optTokenLabel">Token</label>
      <input id="token" type="text" data-i18n-placeholder="optTokenPlaceholder"
             placeholder="The token shown in YouBoard settings">
    </details>
  </section>

  <section>
    <h2 data-i18n="optCaptureHeading">Capture &amp; sync</h2>
    <label class="check">
      <input id="capture" type="checkbox">
      <span data-i18n="optCaptureLabel">Capture copies on web pages (Ctrl+C / cut)</span>
    </label>
    <label class="check">
      <input id="sync" type="checkbox">
      <span data-i18n="optSyncLabel">Also write into the desktop YouBoard</span>
    </label>
    <label for="max" data-i18n="optMaxLabel">How many items to keep in the browser</label>
    <input id="max" type="number" min="20" max="1000" step="10">
    <label for="ignore" data-i18n="optIgnoreLabel">Sites to skip (one per line)</label>
    <textarea id="ignore" rows="3" placeholder="example.com&#10;mail.google.com"></textarea>
  </section>

  <section>
    <h2 data-i18n="optDataHeading">Browser-local data</h2>
    <p class="note" id="stat"></p>
    <div class="row">
      <button id="btn-clear" data-i18n="optClearLocal">Clear browser-local data</button>
    </div>
  </section>

  <section>
    <h2 data-i18n="optPrivacyHeading">Privacy</h2>
    <p class="note" data-i18n="optPrivacyNote">
      The extension never sends data to a remote server.
    </p>
  </section>

  <script src="options.js"></script>
</body>
</html>
