<!DOCTYPE html>
<!-- 界面文字都通过 data-i18n* 在 panel.js 里按浏览器语言填充；
     下面的英文只是"还没跑 JS 时"的兜底。 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YouBoard Clipboard Companion</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon32.png" alt="YouBoard" width="20" height="20">
      <span data-i18n="extName">YouBoard Clipboard Companion</span>
    </div>
    <div id="status" class="status" data-i18n-title="statusTitle"
         title="Desktop connection status"></div>
  </header>

  <div class="searchbar">
    <input id="q" type="search" data-i18n-placeholder="searchPlaceholder"
           placeholder="Search what you copied on web pages…">
  </div>

  <nav class="tabs">
    <button id="tab-local" class="tab active"><span data-i18n="tabCapture">Web capture</span>
      <span id="n-local">0</span></button>
    <button id="tab-desktop" class="tab"><span data-i18n="tabHistory">YouBoard history</span></button>
  </nav>

  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" data-i18n="emptyHint">Nothing here yet.</p>

  <footer>
    <button id="btn-read" class="btn primary" data-i18n="btnReadClipboard">Read clipboard &amp; save</button>
    <button id="btn-clear" class="btn" data-i18n="btnClearCapture">Clear web captures</button>
    <button id="btn-options" class="btn" data-i18n="btnOptions">Settings</button>
  </footer>
  <p class="hint" data-i18n="panelHint">Click an item = copy; double-click = insert.</p>
  <script src="panel.js"></script>
</body>
</html>
