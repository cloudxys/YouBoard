name: Build YouBoard

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyQt6 pillow pyperclip keyboard cryptography pyinstaller==6.22.3 qrcode

      - name: Sync version files
        shell: pwsh
        run: |
          python tools/sync_version.py
          $v = python tools/sync_version.py --print
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "版本号：$v"

      - name: Regression suite (gate)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/verify_all.py

      - name: Build portable EXE
        run: python -m PyInstaller YouBoard.spec --noconfirm

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          iscc youboard_setup.iss
          $issOut = Join-Path (Split-Path $PWD -Parent) "logo\YouBoard_Setup_v$env:APP_VERSION.exe"
          if (Test-Path -LiteralPath $issOut) {
            Copy-Item -LiteralPath $issOut -Destination "YouBoard_Setup_v$env:APP_VERSION.exe" -Force
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouBoard-Windows
          path: |
            dist/YouBoard.exe
            YouBoard_Setup_v${{ env.APP_VERSION }}.exe

  macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install PyQt6 pillow pyperclip \
            pyobjc-framework-Cocoa pyobjc-framework-Quartz \
            cryptography pyinstaller==6.22.3 qrcode

      - name: Sync version files
        run: |
          python3 tools/sync_version.py
          echo "APP_VERSION=$(python3 tools/sync_version.py --print)" >> "$GITHUB_ENV"
          echo "版本号：$APP_VERSION"

      - name: Build .app bundle
        run: python3 -m PyInstaller YouBoard_Mac.spec --noconfirm

      - name: Package DMG and ZIP
        run: |
          APP="dist/YouBoard.app"
          BASE="YouBoard_macOS_arm64_v${APP_VERSION}"
          ls -la dist | head -20
          # 先出 ZIP（最稳的产物）
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${BASE}.zip"
          # 再尝试 DMG：两种参数组合、各重试 3 次，失败不影响 ZIP 发布
          ok=0
          for fsarg in "-fs HFS+" "none"; do
            for i in 1 2 3; do
              if [ "$fsarg" = "none" ]; then
                hdiutil create -volname "YouBoard" -srcfolder "$APP" -ov \
                  -format UDZO "dist/${BASE}.dmg" && { ok=1; break 2; }
              else
                hdiutil create -volname "YouBoard" -srcfolder "$APP" -ov \
                  -format UDZO $fsarg "dist/${BASE}.dmg" && { ok=1; break 2; }
              fi
              rm -f "dist/${BASE}.dmg"
              sleep 8
            done
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::DMG 生成失败，本次只发布 ZIP"
          fi
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouBoard-macOS-arm64
          if-no-files-found: warn
          path: |
            dist/YouBoard_macOS_arm64_v*.dmg
            dist/YouBoard_macOS_arm64_v*.zip

  macos-intel:
    name: macOS (x86_64)
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install PyQt6 pillow pyperclip \
            pyobjc-framework-Cocoa pyobjc-framework-Quartz \
            cryptography pyinstaller==6.22.3 qrcode

      - name: Sync version files
        run: |
          python3 tools/sync_version.py
          echo "APP_VERSION=$(python3 tools/sync_version.py --print)" >> "$GITHUB_ENV"
          echo "版本号：$APP_VERSION"

      - name: Build .app bundle
        run: python3 -m PyInstaller YouBoard_Mac.spec --noconfirm

      - name: Package DMG and ZIP
        run: |
          APP="dist/YouBoard.app"
          BASE="YouBoard_macOS_x86_64_v${APP_VERSION}"
          ls -la dist | head -20
          # 先出 ZIP（最稳的产物）
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${BASE}.zip"
          # 再尝试 DMG：两种参数组合、各重试 3 次，失败不影响 ZIP 发布
          ok=0
          for fsarg in "-fs HFS+" "none"; do
            for i in 1 2 3; do
              if [ "$fsarg" = "none" ]; then
                hdiutil create -volname "YouBoard" -srcfolder "$APP" -ov \
                  -format UDZO "dist/${BASE}.dmg" && { ok=1; break 2; }
              else
                hdiutil create -volname "YouBoard" -srcfolder "$APP" -ov \
                  -format UDZO $fsarg "dist/${BASE}.dmg" && { ok=1; break 2; }
              fi
              rm -f "dist/${BASE}.dmg"
              sleep 8
            done
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::DMG 生成失败，本次只发布 ZIP"
          fi
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouBoard-macOS-x86_64
          if-no-files-found: warn
          path: |
            dist/YouBoard_macOS_x86_64_v*.dmg
            dist/YouBoard_macOS_x86_64_v*.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, macos-intel]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checksums (SHA256 of every artifact)
        run: |
          # 给 Windows 与 macOS 的所有产物生成一份校验清单，随 Release 一起发布
          cd artifacts
          : > ../SHA256SUMS.txt
          find . -type f | LC_ALL=C sort | while IFS= read -r f; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")" \
              >> ../SHA256SUMS.txt
          done
          cd ..
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 若上次残留了同名 Release，先删除，避免“already exists”
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && gh release delete "$GITHUB_REF_NAME" --yes || true
          # 上传所有产物文件（跳过目录，避免 dist 目录被当作文件上传失败）
          mapfile -t files < <(find artifacts -type f)
          # 正文 = 仓库里的"一句话更新摘要"（应用内「检查更新」会显示这段），
          # 没有这个文件才退回完整更新说明；哈希清单作为附件发布，不再刷屏正文
          V="${GITHUB_REF_NAME#v}"
          if [ -f RELEASE_SUMMARY.md ]; then
            NOTES=RELEASE_SUMMARY.md
          else
            NOTES=RELEASE_NOTES.md
          fi
          {
            cat "$NOTES"
            echo ""
            echo "文件校验（SHA256）见附件 \`SHA256SUMS.txt\`：Windows 用 \`certutil -hashfile YouBoard_Setup_v${V}.exe SHA256\`，"
            echo "macOS 用 \`shasum -a 256 YouBoard_macOS_arm64_v${V}.dmg\` 对一下即可；macOS 包未签名，首次打开请右键 →「打开」。"
          } > RELEASE_BODY.md
          gh release create "$GITHUB_REF_NAME" "${files[@]}" SHA256SUMS.txt \
            --title "YouBoard $GITHUB_REF_NAME" \
            --notes-file RELEASE_BODY.md
