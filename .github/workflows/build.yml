name: Build YouBoard

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyQt6 pillow pyperclip keyboard cryptography pyinstaller==6.22.3 qrcode

      - name: Build portable EXE
        run: python -m PyInstaller YouBoard.spec --noconfirm

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          iscc youboard_setup.iss
          $issOut = Join-Path (Split-Path $PWD -Parent) "logo\YouBoard_Setup_v3.2.5.exe"
          if (Test-Path -LiteralPath $issOut) {
            Copy-Item -LiteralPath $issOut -Destination "YouBoard_Setup_v3.2.5.exe" -Force
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouBoard-Windows
          path: |
            dist/YouBoard.exe
            YouBoard_Setup_v3.2.5.exe

  macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install PyQt6 pillow pyperclip \
            pyobjc-framework-Cocoa pyobjc-framework-Quartz \
            cryptography pyinstaller==6.22.3 qrcode

      - name: Build .app bundle
        run: python3 -m PyInstaller YouBoard_Mac.spec --noconfirm

      - name: Package DMG and ZIP
        run: |
          APP="dist/YouBoard.app"
          BASE="YouBoard_macOS_arm64_v3.2.5"
          ls -la dist | head -20
          # 先出 ZIP（最稳的产物）
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${BASE}.zip"
          # 再尝试 DMG：两种参数组合、各重试 3 次，失败不影响 ZIP 发布
          ok=0
          for fsarg in "-fs HFS+" "none"; do
            for i in 1 2 3; do
              if [ "$fsarg" = "none" ]; then
                hdiutil create -volname "YouBoard" -srcfolder "$APP" -ov \
                  -format UDZO "dist/${BASE}.dmg" && { ok=1; break 2; }
              else
                hdiutil create -volname "YouBoard" -srcfolder "$APP" -ov \
                  -format UDZO $fsarg "dist/${BASE}.dmg" && { ok=1; break 2; }
              fi
              rm -f "dist/${BASE}.dmg"
              sleep 8
            done
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::DMG 生成失败，本次只发布 ZIP"
          fi
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouBoard-macOS-arm64
          if-no-files-found: warn
          path: |
            dist/YouBoard_macOS_arm64_v3.2.5.dmg
            dist/YouBoard_macOS_arm64_v3.2.5.zip

  macos-intel:
    name: macOS (x86_64)
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install PyQt6 pillow pyperclip \
            pyobjc-framework-Cocoa pyobjc-framework-Quartz \
            cryptography pyinstaller==6.22.3 qrcode

      - name: Build .app bundle
        run: python3 -m PyInstaller YouBoard_Mac.spec --noconfirm

      - name: Package DMG and ZIP
        run: |
          APP="dist/YouBoard.app"
          BASE="YouBoard_macOS_x86_64_v3.2.5"
          ls -la dist | head -20
          # 先出 ZIP（最稳的产物）
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${BASE}.zip"
          # 再尝试 DMG：两种参数组合、各重试 3 次，失败不影响 ZIP 发布
          ok=0
          for fsarg in "-fs HFS+" "none"; do
            for i in 1 2 3; do
              if [ "$fsarg" = "none" ]; then
                hdiutil create -volname "YouBoard" -srcfolder "$APP" -ov \
                  -format UDZO "dist/${BASE}.dmg" && { ok=1; break 2; }
              else
                hdiutil create -volname "YouBoard" -srcfolder "$APP" -ov \
                  -format UDZO $fsarg "dist/${BASE}.dmg" && { ok=1; break 2; }
              fi
              rm -f "dist/${BASE}.dmg"
              sleep 8
            done
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::DMG 生成失败，本次只发布 ZIP"
          fi
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouBoard-macOS-x86_64
          if-no-files-found: warn
          path: |
            dist/YouBoard_macOS_x86_64_v3.2.5.dmg
            dist/YouBoard_macOS_x86_64_v3.2.5.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, macos-intel]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 若上次残留了同名 Release，先删除，避免“already exists”
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && gh release delete "$GITHUB_REF_NAME" --yes || true
          # 上传所有产物文件（跳过目录，避免 dist 目录被当作文件上传失败）
          mapfile -t files < <(find artifacts -type f)
          # 用仓库里的简短更新说明作为 Release 正文（应用内「检查更新」会显示这段）
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "YouBoard $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
