name: Build YouBoard

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyQt6 pillow pyperclip keyboard cryptography pyinstaller qrcode

      - name: Build portable EXE
        run: python -m PyInstaller YouBoard.spec --noconfirm

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          iscc youboard_setup.iss
          $issOut = Join-Path (Split-Path $PWD -Parent) "logo\YouBoard_Setup_v2.7.0.exe"
          if (Test-Path -LiteralPath $issOut) {
            Copy-Item -LiteralPath $issOut -Destination "YouBoard_Setup_v2.7.0.exe" -Force
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouBoard-Windows
          path: |
            dist/YouBoard.exe
            YouBoard_Setup_v2.7.0.exe

  macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install PyQt6 pillow pyperclip \
            pyobjc-framework-Cocoa pyobjc-framework-Quartz \
            cryptography pyinstaller qrcode

      - name: Build .app bundle
        run: python3 -m PyInstaller YouBoard_Mac.spec --noconfirm

      - name: Package DMG and ZIP
        run: |
          APP="dist/YouBoard.app"
          BASE="YouBoard_macOS_arm64_v2.7.0"
          hdiutil create -volname "YouBoard" -srcfolder "$APP" -ov \
            -format UDZO "dist/${BASE}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${BASE}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouBoard-macOS-arm64
          path: |
            dist/YouBoard_macOS_arm64_v2.7.0.dmg
            dist/YouBoard_macOS_arm64_v2.7.0.zip

  macos-intel:
    name: macOS (x86_64)
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install PyQt6 pillow pyperclip \
            pyobjc-framework-Cocoa pyobjc-framework-Quartz \
            cryptography pyinstaller qrcode

      - name: Build .app bundle
        run: python3 -m PyInstaller YouBoard_Mac.spec --noconfirm

      - name: Package DMG and ZIP
        run: |
          APP="dist/YouBoard.app"
          BASE="YouBoard_macOS_x86_64_v2.7.0"
          hdiutil create -volname "YouBoard" -srcfolder "$APP" -ov \
            -format UDZO "dist/${BASE}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${BASE}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouBoard-macOS-x86_64
          path: |
            dist/YouBoard_macOS_x86_64_v2.7.0.dmg
            dist/YouBoard_macOS_x86_64_v2.7.0.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*/* --generate-notes
